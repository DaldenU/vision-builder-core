name: Vision Builder CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-format:
    name: Code Quality & Style Checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8

      - name: Run Black Code Formatting Check
        run: |
          black --check vision_builder tests

      - name: Run Flake8 Linter
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 vision_builder tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Enforce PEP 8 with max line length 88
          flake8 vision_builder tests --count --max-line-length=88 --extend-ignore=E203,W503 --statistics

  security-audit:
    name: DevSecOps Security Audit (Bandit)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Bandit SAST Scanner
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Execute Security Scan
        run: |
          bandit -r vision_builder -ll -ii

  type-check:
    name: Static Type Verification (Mypy)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies & Mypy
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Mypy Type Checking
        run: |
          mypy vision_builder tests

  test-matrix:
    name: Automated Tests (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    needs: [lint-and-format, security-audit, type-check]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Package & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Test Suite with Coverage
        run: |
          pytest --cov=vision_builder --cov-report=term-missing --cov-report=xml

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v7
        if: matrix.python-version == '3.11'
        with:
          name: code-coverage-report
          path: coverage.xml

  build-package:
    name: Build Distribution Artifacts & Docker Image
    needs: [test-matrix]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Build Module
        run: |
          python -m pip install --upgrade pip build

      - name: Build Wheel & Source Distribution
        run: |
          python -m build

      - name: Build Docker Image & Run Container Smoke Test
        run: |
          docker build -t vision-builder-core:ci .
          docker run --rm vision-builder-core:ci vision-builder benchmark --iterations 25 --defect-rate 0.2

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-wheel-dist
          path: dist/*
