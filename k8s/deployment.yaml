apiVersion: apps/v1
kind: Deployment
metadata:
  name: vision-builder-core
  labels:
    app: vision-builder-core
    tier: edge-cv-ops
    project: vision-builder
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vision-builder-core
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: vision-builder-core
        tier: edge-cv-ops
    spec:
      containers:
        - name: vision-builder-core
          image: daldenu/vision-builder-core:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: vision-builder-core-svc
  labels:
    app: vision-builder-core
spec:
  type: NodePort
  selector:
    app: vision-builder-core
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30080
